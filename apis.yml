aid: wave-financial
name: Wave Financial
description: Free accounting software for small businesses with a GraphQL API for
  managing invoices, estimates, customers, products, accounts, and financial reporting.
  The API uses OAuth 2.0 for authentication and supports operations for businesses,
  customers, invoices, transactions, vendors, taxes, and webhooks.
